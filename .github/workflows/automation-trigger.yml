name: Levela automation trigger

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to process"
        required: false
        type: string
      memo:
        description: "Extra Discord/context text"
        required: false
        type: string
      instruction:
        description: "Image direction"
        required: false
        type: string
      mode:
        description: "generic or ai-drill-ranking"
        required: false
        default: "ai-drill-ranking"
        type: choice
        options:
          - generic
          - ai-drill-ranking

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployed automation endpoint
        env:
          AUTOMATION_ENDPOINT: ${{ secrets.AUTOMATION_ENDPOINT }}
          AUTOMATION_TRIGGER_SECRET: ${{ secrets.AUTOMATION_TRIGGER_SECRET }}
          LEVELA_AI_DRILL_RANKING_JSON_URL: ${{ secrets.LEVELA_AI_DRILL_RANKING_JSON_URL }}
          LEVELA_AI_DRILL_COOKIE: ${{ secrets.LEVELA_AI_DRILL_COOKIE }}
          LEVELA_AI_DRILL_AUTHORIZATION: ${{ secrets.LEVELA_AI_DRILL_AUTHORIZATION }}
          LEVELA_AI_DRILL_TARGET_MEMBERS: ${{ secrets.LEVELA_AI_DRILL_TARGET_MEMBERS }}
          LEVELA_AI_DRILL_ROUND_START: ${{ secrets.LEVELA_AI_DRILL_ROUND_START }}
          LEVELA_AI_DRILL_ROUND_START_DATE: ${{ secrets.LEVELA_AI_DRILL_ROUND_START_DATE }}
          LEVELA_AI_DRILL_PHASE: ${{ secrets.LEVELA_AI_DRILL_PHASE }}
          LEVELA_AI_DRILL_DAY_START: ${{ secrets.LEVELA_AI_DRILL_DAY_START }}
          LEVELA_AI_DRILL_GIT_DAYS_LEFT: ${{ secrets.LEVELA_AI_DRILL_GIT_DAYS_LEFT }}
          SCHEDULE_URLS: ${{ secrets.SCHEDULE_URLS }}
          SCHEDULE_MEMO: ${{ secrets.SCHEDULE_MEMO }}
          SCHEDULE_INSTRUCTION: ${{ secrets.SCHEDULE_INSTRUCTION }}
          AUTOMATION_MODE: ${{ secrets.AUTOMATION_MODE }}
          URLS: ${{ inputs.urls }}
          MEMO: ${{ inputs.memo }}
          INSTRUCTION: ${{ inputs.instruction }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          endpoint = os.environ["AUTOMATION_ENDPOINT"]
          secret = os.environ["AUTOMATION_TRIGGER_SECRET"]
          mode = os.environ.get("MODE") or os.environ.get("AUTOMATION_MODE") or "generic"

          if mode == "ai-drill-ranking":
              endpoint = endpoint.rstrip("/").replace("/api/automation/trigger", "/api/automation/ai-drill-ranking")
              payload = json.dumps({
                  "rankingJsonUrl": os.environ.get("LEVELA_AI_DRILL_RANKING_JSON_URL", ""),
                  "rankingCookie": os.environ.get("LEVELA_AI_DRILL_COOKIE", ""),
                  "rankingAuthorization": os.environ.get("LEVELA_AI_DRILL_AUTHORIZATION", ""),
                  "targetMembers": os.environ.get("LEVELA_AI_DRILL_TARGET_MEMBERS", ""),
                  "roundStart": os.environ.get("LEVELA_AI_DRILL_ROUND_START", ""),
                  "roundStartDate": os.environ.get("LEVELA_AI_DRILL_ROUND_START_DATE", ""),
                  "phase": os.environ.get("LEVELA_AI_DRILL_PHASE", ""),
                  "dayStart": os.environ.get("LEVELA_AI_DRILL_DAY_START", ""),
                  "gitDaysLeft": os.environ.get("LEVELA_AI_DRILL_GIT_DAYS_LEFT", ""),
                  "skipDiscordPost": True,
              }).encode("utf-8")
          else:
              urls_text = os.environ.get("URLS") or os.environ.get("SCHEDULE_URLS", "")
              urls = [url for url in urls_text.split() if url]
              memo = os.environ.get("MEMO") or os.environ.get("SCHEDULE_MEMO", "")
              instruction = os.environ.get("INSTRUCTION") or os.environ.get("SCHEDULE_INSTRUCTION", "")

              if not urls and not memo:
                  print("No URLs or memo configured; skipping trigger.")
                  raise SystemExit(0)

              payload = json.dumps({
                  "urls": urls,
                  "discordText": memo,
                  "instruction": instruction,
                  "skipDiscordPost": True,
                  "trigger": "schedule",
              }).encode("utf-8")

          request = urllib.request.Request(
              endpoint,
              data=payload,
              headers={
                  "content-type": "application/json",
                  "authorization": f"Bearer {secret}",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              response_text = response.read().decode("utf-8")
              print(response_text)

          if mode == "ai-drill-ranking":
              result = json.loads(response_text)
              os.makedirs("automation-output", exist_ok=True)
              with open("automation-output/discord-post.txt", "w", encoding="utf-8") as file:
                  file.write(result.get("summary", ""))
                  file.write("\n")
              with open("automation-output/discord-post.md", "w", encoding="utf-8") as file:
                  file.write(result.get("summary", ""))
                  file.write("\n")
              with open("automation-output/README_iPhone.txt", "w", encoding="utf-8") as file:
                  file.write("AIドリルランキング投稿素材\n")
                  file.write("==========================\n\n")
                  file.write("Discordへ自動送信はしていません。このZIPの中身を本人が投稿してください。\n\n")
                  file.write("1. ai-drill-total-ranking.png をDiscordに添付\n")
                  file.write("2. ai-drill-daily-ranking.png をDiscordに添付\n")
                  file.write("3. discord-post.txt の本文をコピーしてDiscord本文に貼り付け\n")
                  file.write("4. 内容を確認して送信\n\n")
                  file.write("iPhoneの場合: ZIPをファイルアプリで開き、画像を長押し保存してからDiscordに添付してください。\n")
              def write_png(file_name, image_data_url):
                  if not image_data_url.startswith("data:image/png;base64,"):
                      return
                  import base64
                  image_bytes = base64.b64decode(image_data_url.split(",", 1)[1])
                  with open(f"automation-output/{file_name}", "wb") as file:
                      file.write(image_bytes)

              write_png("ai-drill-total-ranking.png", result.get("imageDataUrl", ""))
              for image in result.get("extraImages", []):
                  write_png(image.get("fileName", "ai-drill-extra-ranking.png"), image.get("imageDataUrl", ""))

              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
                  file.write("## AIドリルランキング投稿素材を作成しました\n\n")
                  file.write("Discordへは自動送信していません。\n\n")
                  file.write("Artifacts の `ai-drill-ranking-manual-post` をダウンロードして、以下を本人がDiscordへ投稿してください。\n\n")
                  file.write("- `discord-post.txt` または `discord-post.md`: 投稿本文\n")
                  file.write("- `ai-drill-total-ranking.png`: 総合ポイントランキング画像\n")
                  file.write("- `ai-drill-daily-ranking.png`: デイリーランキング画像\n")
          PY
      - name: Upload manual posting draft
        uses: actions/upload-artifact@v4
        with:
          name: ai-drill-ranking-manual-post
          path: automation-output/
          if-no-files-found: ignore
          retention-days: 14
